<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vellumi</title>
  <link rel="stylesheet" href="editor.css">
  <link id="theme-light" rel="stylesheet" href="themes/frame-light.css" media="(prefers-color-scheme: light)">
  <link id="theme-dark" rel="stylesheet" href="themes/frame-dark.css" media="(prefers-color-scheme: dark)">
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent;
      -webkit-text-size-adjust: 100%;
    }
    #editor {
      max-width: var(--vellumi-max-width, 760px);
      min-height: 100%;
      margin: 0 auto;
      padding: 48px 56px 40vh;
      box-sizing: border-box;
    }
    /* Typography overrides (Preferences ▸ 排印). Unset variables fall back to
       the active theme's own metrics. */
    :root[data-vellumi-font="serif"] .milkdown {
      --crepe-font-default: Georgia, "Times New Roman", "Songti SC", "STSong", serif;
    }
    :root[data-vellumi-font="sans"] .milkdown {
      --crepe-font-default: -apple-system, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    .milkdown .ProseMirror {
      line-height: var(--vellumi-line-height, inherit);
    }
    .milkdown .ProseMirror > p {
      margin-block: var(--vellumi-paragraph-spacing, revert);
    }
    /* Theming follows prefers-color-scheme only (WKWebView mirrors the host
       appearance); an in-app override would need to swap the theme <link>s,
       not just color-scheme. */
    .milkdown { background: transparent; }
    /* Focus mode: dim everything except the caret's block. Opacity-only
       transition — animating anything layout-affecting here would wobble. */
    body.vellumi-focus-mode .ProseMirror > * {
      opacity: 0.3;
      transition: opacity 0.25s ease-out;
    }
    body.vellumi-focus-mode .ProseMirror > .vellumi-focus-active {
      opacity: 1;
    }
    /* Mermaid diagrams: centered, width-capped, padded like a block. */
    .vellumi-mermaid {
      text-align: center;
      padding: 8px 0;
      white-space: pre-wrap; /* raw-source fallback stays readable */
    }
    .vellumi-mermaid svg { max-width: 100%; }
    /* Crepe ships `transition: all .2s` on several editing affordances, which
       animates POSITION too — the block handle visibly "chases" the pointer
       across paragraphs and the toolbar slides after every selection change.
       Narrow both to opacity so they fade instead of glide. */
    .milkdown-block-handle,
    milkdown-toolbar,
    .milkdown-toolbar {
      transition-property: opacity !important;
    }
    /* Selection visibility. Two problems: (1) WebKit's default selection wash
       is too faint against the code block's own dark background; (2) inside
       CodeMirror blocks the native ::selection is transparent — the visible
       selection is CM's drawn .cm-selectionBackground layer, which the theme
       styles too weakly. Use a clear accent wash for both, boosted in dark. */
    .milkdown ::selection {
      background: rgba(93, 128, 250, 0.35);
    }
    .milkdown .cm-editor .cm-selectionBackground {
      background: rgba(93, 128, 250, 0.32) !important;
    }
    .milkdown .cm-editor.cm-focused .cm-selectionBackground {
      background: rgba(93, 128, 250, 0.42) !important;
    }
    @media (prefers-color-scheme: dark) {
      .milkdown ::selection {
        background: rgba(130, 160, 255, 0.45);
      }
      .milkdown .cm-editor .cm-selectionBackground {
        background: rgba(130, 160, 255, 0.42) !important;
      }
      .milkdown .cm-editor.cm-focused .cm-selectionBackground {
        background: rgba(130, 160, 255, 0.55) !important;
      }
    }

    /* prosemirror-tables column resize affordance (experiment, item 11). */
    .milkdown .column-resize-handle {
      position: absolute;
      right: -2px;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--crepe-color-primary, #4c6ef5);
      opacity: 0.6;
      pointer-events: none;
      z-index: 20;
    }
    .milkdown .resize-cursor { cursor: col-resize; }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script>
    // VoiceOver picks its voice from <html lang>; hardcoding "en" made it read
    // Chinese documents with an English voice. moltenAPI's injected app
    // language is the best available signal.
    document.documentElement.lang =
      (typeof window.__vellumiLanguage === "string" && window.__vellumiLanguage) ||
      navigator.language ||
      "en";
  </script>
  <script src="editor.js"></script>
</body>
</html>
