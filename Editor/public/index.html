<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Molten</title>
  <link rel="stylesheet" href="editor.css">
  <link rel="stylesheet" href="themes/light.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="themes/dark.css" media="(prefers-color-scheme: dark)">
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent;
      -webkit-text-size-adjust: 100%;
    }
    #editor {
      max-width: 760px;
      min-height: 100%;
      margin: 0 auto;
      padding: 48px 56px 40vh;
      box-sizing: border-box;
    }
    /* Theming follows prefers-color-scheme only (WKWebView mirrors the host
       appearance); an in-app override would need to swap the theme <link>s,
       not just color-scheme. */
    .milkdown { background: transparent; }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script src="editor.js"></script>
</body>
</html>
