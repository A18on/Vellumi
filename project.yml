name: Vellumi

options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: "13.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    ONLY_ACTIVE_ARCH: NO
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES

targets:
  Vellumi:
    type: application
    platform: macOS
    sources:
      # Shared/ stays platform-agnostic for the future iOS target (MarkMac layout).
      - Shared
      - Mac
      - path: Resources/dist
        buildPhase: resources
        type: folder
      - path: Resources/en.lproj
        buildPhase: resources
        type: folder
      - path: Resources/zh-Hans.lproj
        buildPhase: resources
        type: folder
      - path: Resources/imagecard
        buildPhase: resources
        type: folder
      - path: Resources/vendor
        buildPhase: resources
        type: folder
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_NAME: Vellumi
        PRODUCT_BUNDLE_IDENTIFIER: com.aaron.vellumi
        INFOPLIST_FILE: Mac/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Vellumi.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0

  VellumiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Vellumi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaron.vellumi.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vellumi.app/Contents/MacOS/Vellumi"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Vellumi:
    build:
      targets:
        Vellumi: all
        VellumiTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - VellumiTests
